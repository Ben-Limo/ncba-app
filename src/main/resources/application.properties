spring.application.name=country-info-service
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ncbadb}
spring.datasource.username=${DB_USERNAME:ncbauser}
spring.datasource.password=${DB_PASSWORD:ncbapass}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

# Health probes for Kubernetes
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health,info

# Clean shutdown when Kubernetes sends SIGTERM
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s