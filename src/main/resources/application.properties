spring.application.name=country-info-service
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/devdb}
spring.datasource.username=${DB_USERNAME:devuser}
spring.datasource.password=${DB_PASSWORD:devpass}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

# Health probes for Kubernetes
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health,info

# Clean shutdown when Kubernetes sends SIGTERM
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

logging.structured.format.console=logstash
# or "ecs" for Elastic Common Schema

soap.country.info.url=http://webservices.oorsprong.org/websamples.countryinfo/CountryInfoService.wso
soap.log.payload=true
soap.log.max-payload-chars=8000